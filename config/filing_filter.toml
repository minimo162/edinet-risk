# 有報の絞り込み条件（レビュー H2 / 計画 §6-1）。M0 のクロス集計を根拠に版管理する。
# 0.2-m2: 内容は 0.1-m0 と同じ。[candidates] は M2 の resolve（resolve/versions.py FilingFilter）で
#   すでに版グループの判定に使っているため、コメントを実態に合わせた（「予定」→「使用中」）。
#   実データ（書類一覧 2024-04-01〜2026-10-27。暦日 940 日すべて走査済み、書類のある日は 625 日）の
#   120/130 × ordinanceCode=010（documents、docID 単位）は、120 が 030000 11,580・080000 207・082000 134・
#   032000 9・040000 1、130 が 030001 2,003・080001 31・082001 13。
#   702001 はこの期間でも 0 件（実例 docID なし。spike-findings §M0-8）。
version = "0.2-m2"

# 原本（版グループの起点）
[annual_report]
docTypeCode = ["120"]
ordinanceCode = ["010"]
formCode = ["030000"]
xbrlFlag = "1"

# 版グループに入れる訂正・XBRL の修正（使用中）。ordinanceCode は [annual_report] と同じものに限る。
# 030001 = 訂正有価証券報告書（内国会社）、702001 = XBRL の修正（書類種別は訂正有報）。
# これ以外の formCode の 120/130 は対象外（form_out_of_scope の判定・monitor の除外件数）。
[candidates]
correction_docTypeCode = ["130"]
formCode_extra = ["030001", "702001"]
